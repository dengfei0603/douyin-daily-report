name: 抖音达人日报

on:
  schedule:
    # 每天早上8:00 (北京时间 = UTC 0:00)
    - cron: "0 0 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: 安装依赖
      run: |
        pip install requests
    
    - name: 运行日报
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      run: |
        python daily_report_github.py
    
    - name: 上传日报HTML
      uses: actions/upload-artifact@v4
      with:
        name: daily-report
        path: reports/*.html
