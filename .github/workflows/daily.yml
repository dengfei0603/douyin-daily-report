name: 抖音达人日报

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: 安装依赖
      run: pip install requests PyNaCl
    
    - name: 自动采集+生成日报
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      run: python auto_daily.py
    
    - name: 上传日报HTML
      uses: actions/upload-artifact@v4
      with:
        name: daily-report
        path: reports/*.html
